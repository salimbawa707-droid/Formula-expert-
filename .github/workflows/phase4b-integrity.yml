name: Phase 4B Integrity and Build Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase4b-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Evidence integrity, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install XLSX parser
        run: python -m pip install openpyxl==3.1.5

      - name: Validate Pušić AI source comparison ledger
        run: python evidence_vault/scripts/validate_pusic_ai_evidence.py evidence_vault/datasets/pusic_2006_tables_5_8_r460.csv evidence_vault/review_workbooks/pusic_2006_ai_visual_comparison_144.csv

      - name: Test Pušić AI evidence validator
        run: python evidence_vault/scripts/test_validate_pusic_ai_evidence.py

      - name: Test strict Pušić R460 independent-review gate
        run: python evidence_vault/scripts/test_validate_pusic_2006_r460.py

      - name: Test Zenodo XLSX parser against canonical workbooks
        run: python evidence_vault/scripts/test_audit_zenodo_xlsx.py evidence_vault/datasets/zenodo_18961871

      - name: Test Task 3 dataset audit policy and artifacts
        run: python evidence_vault/scripts/test_task3_dataset_audit.py

      - name: Reproduce ENG-002 ideal Clint benchmark and verify committed outputs
        run: python evidence_vault/scripts/benchmark_clint_cmc.py --check

      - name: Test ENG-002 Clint benchmark controls and dataset grouping
        run: python evidence_vault/scripts/test_benchmark_clint_cmc.py

      - name: Reproduce Task 2 water-reference baseline
        run: python evidence_vault/scripts/evaluate_water_reference.py evidence_vault/datasets/zenodo_18961871/Supplementary_SolutionFlowCurves.xlsx evidence_vault/datasets/zenodo_18961871/task2_water_reference_baseline.json

      - name: Test Task 2 baseline classification and lineage
        run: python evidence_vault/scripts/test_evaluate_water_reference.py evidence_vault/datasets/zenodo_18961871/Supplementary_SolutionFlowCurves.xlsx

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check ENG-002 catalog provenance register and eligibility report
        run: npx tsx evidence_vault/scripts/audit_eng002_catalog.ts --check

      - name: Verify canonical evidence workbook bytes
        run: npm run verify:evidence

      - name: Independently reconcile Round-6 workbook ledger and parser artifacts
        run: python evidence_vault/scripts/round17_independent_reconciliation.py --check

      - name: Syntax-check reproducible acquisition and reconciliation scripts
        run: python -m py_compile evidence_vault/scripts/acquire_repod_foam.py evidence_vault/scripts/round17_independent_reconciliation.py evidence_vault/scripts/round18_historical_aggregate_reconciliation.py evidence_vault/scripts/round19_raw_workbook_lineage.py evidence_vault/scripts/round20_source_record_reconciliation.py evidence_vault/scripts/test_round20_source_record_reconciliation.py

      - name: Reconcile historical 27,982 aggregate claims without inferring physical counts
        run: python evidence_vault/scripts/round18_historical_aggregate_reconciliation.py

      - name: Extract raw workbook cell, formula, image and rheometer lineage
        run: python evidence_vault/scripts/round19_raw_workbook_lineage.py

      - name: Preserve Round-18 and Round-19 reconciliation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-round18-round19-lineage-audit
          path: |
            evidence_vault/forensic_reports/PHASE4B_ROUND18_HISTORICAL_AGGREGATE_RECONCILIATION.json
            evidence_vault/forensic_reports/PHASE4B_ROUND19_RAW_WORKBOOK_LINEAGE.md
            evidence_vault/forensic_reports/PHASE4B_ROUND19_RAW_WORKBOOK_LINEAGE.json
            evidence_vault/forensic_reports/PHASE4B_ROUND19_CELL_FORMULA_LINEAGE.csv
            evidence_vault/forensic_reports/PHASE4B_ROUND19_IMAGE_MEASUREMENT_LINEAGE.csv
            evidence_vault/forensic_reports/PHASE4B_ROUND19_RHEOMETER_TEST_POINT_LINEAGE.csv
          if-no-files-found: error
          retention-days: 30

      - name: Reconcile source records, formula dependencies and grouped rheometer points
        run: python evidence_vault/scripts/round20_source_record_reconciliation.py

      - name: Test Round-20 historical-claim and scientific-governance invariants
        run: python evidence_vault/scripts/test_round20_source_record_reconciliation.py

      - name: Preserve Round-20 source-record reconciliation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-round20-source-record-reconciliation
          path: |
            evidence_vault/forensic_reports/PHASE4B_ROUND20_SOURCE_RECORD_RECONCILIATION.md
            evidence_vault/forensic_reports/PHASE4B_ROUND20_SOURCE_RECORD_RECONCILIATION.json
            evidence_vault/forensic_reports/PHASE4B_ROUND20_FORMULA_DEPENDENCY_LEDGER.csv
            evidence_vault/forensic_reports/PHASE4B_ROUND20_CATEGORY_RECORD_RECONCILIATION.csv
            evidence_vault/forensic_reports/PHASE4B_ROUND20_RHEOMETER_GROUPED_POINT_LEDGER.csv
            evidence_vault/forensic_reports/PHASE4B_ROUND20_HISTORICAL_CLAIM_CROSSWALK.csv
          if-no-files-found: error
          retention-days: 30

      - name: Acquire and validate official RepOD foam dataset
        run: python evidence_vault/scripts/acquire_repod_foam.py

      - name: Test RepOD source checksum, layout, missingness and scientific-status guards
        run: python evidence_vault/scripts/test_repod_foam_audit.py

      - name: Preserve acquired source and normalized audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4b-repod-foam-audit
          path: evidence_vault/datasets/repod_foam/
          if-no-files-found: ignore
          retention-days: 30

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run project test suite
        run: npm test

      - name: Production build
        run: npm run build
