name: Engine verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run regression suite
        run: npm test
      - name: Build production app
        run: npm run build
      - name: Smoke test production HTTP server
        env:
          NODE_ENV: production
          PORT: 4173
          ALLOWED_ORIGINS: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          node dist-server/server.cjs > /tmp/formula-expert-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ -o /tmp/formula-expert-home.html; then break; fi
            sleep 1
          done
          test -s /tmp/formula-expert-home.html
          curl --fail --silent http://127.0.0.1:4173/api/ai/status -o /tmp/formula-expert-ai-status.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/formula-expert-ai-status.json','utf8')); if(x.status!=='ok') process.exit(1); console.log('HTTP smoke test passed: app shell served and AI status endpoint returned ok.');"
