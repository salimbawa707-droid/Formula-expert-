name: Current Release Quality Gates

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_android_debug_apk:
        description: "Build a debug APK only after the Phase 5 gate is open"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: current-release-quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: Reproducible dependency install and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production frontend
        run: bun run build

  typescript-typecheck:
    name: TypeScript typecheck (`bun run lint`)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run lint (tsc --noEmit)
        run: bun run lint

  production-server-smoke:
    name: Production server boot and /api/health smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for the production server
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production frontend
        run: bun run build

      - name: Boot production server and verify /api/health
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=production PORT=3000 node server.ts > server-smoke.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health -o health.json; then
              ok=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "ERROR: production server exited before answering /api/health"
              cat server-smoke.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "ERROR: /api/health did not become healthy within 30 seconds"
            cat server-smoke.log
            exit 1
          fi

          cat health.json
          node -e 'const health = require("./health.json"); if (health.status !== "ok") { console.error("ERROR: /api/health did not report status ok"); process.exit(1); } console.log("PASS: production server booted and /api/health responded");'

  phase6-regression:
    name: P1 Phase 6 lab evidence regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run Phase 6 lab evidence regression suite
        run: bun run test:phase6

  full-typescript-regression:
    name: Full TypeScript regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate current formula report for regression checks
        run: bun run scripts/audit_39_current_status.ts

      - name: Install isolated IndexedDB test polyfill
        run: npm install --no-save --package-lock=false --ignore-scripts fake-indexeddb@6.2.4

      - name: Run Dexie v1 and v2 to v3 IndexedDB migration regressions
        run: bun run test:db-migration

      - name: Run all registered TypeScript regressions
        run: bun run test:all

  android-debug-build:
    if: (github.event_name == 'workflow_dispatch' && inputs.build_android_debug_apk == true) || github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fix/'))
    name: Capacitor Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Android Emulator 37+ requires explicit opt-in when QEMU TCG is used.
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for Capacitor CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Confirm debug build is not a scientific release certification
        run: echo "Building a debug APK for integration verification only; Phase 5 evidence lock still blocks scientific release certification."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production web assets
        run: bun run build

      - name: Synchronize Capacitor Android project
        run: bun run cap:sync

      - name: Clear stale Gradle instrumentation cache
        run: rm -rf "$GRADLE_USER_HOME/caches/jars-9"

      - name: Build genuine debug APK
        run: bash ./gradlew --no-daemon assembleDebug
        working-directory: android

      - name: Enable KVM for Android emulator when available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              echo "KVM is available to the runner; emulator will use hardware acceleration."
            else
              echo "KVM exists but is not accessible; the emulator will use the TCG fallback."
            fi
          else
            echo "No /dev/kvm device; the emulator will use the TCG fallback."
          fi

      - name: Run Android WebView document persistence and download instrumentation test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: cd android && bash ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Capture Android WebView runtime logs
        if: always()
        shell: bash
        run: |
          set +e
          adb logcat -d -v threadtime > android-webview-logcat.txt 2>&1
          grep -Ei 'chromium|WebView|Capacitor|Uncaught|ReferenceError|TypeError|SyntaxError|Firebase|console' android-webview-logcat.txt | tail -n 800 > android-webview-errors.txt
          true

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formula-expert-android-instrumentation-reports
          path: |
            android/app/build/reports/androidTests/connected/
            android-webview-logcat.txt
            android-webview-errors.txt
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: formula-expert-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  evidence-guardrails:
    name: Evidence syntax, regression and fail-closed gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile evidence scripts
        shell: bash
        run: |
          set -euo pipefail
          find evidence_vault/scripts -type f -name '*.py' -print0 | xargs -0 -r python -m py_compile

      - name: Verify Phase 1 engine inventory and dependency manifest
        run: node evidence_vault/scripts/verify_engine_inventory.mjs

      - name: Test Pušić extraction validator
        run: python evidence_vault/scripts/test_validate_pusic_2006_r460.py

      - name: Test independent-review comparator
        run: python evidence_vault/scripts/test_compare_pusic_independent_review.py

      - name: Test PhDat label provenance guardrails
        run: python evidence_vault/scripts/test_audit_phdat_label_provenance.py

      - name: Test PhDat identity and applicability guardrails
        run: python evidence_vault/scripts/test_audit_phdat_identity_applicability.py

      - name: Test PhDat compatibility readiness guardrails
        run: python evidence_vault/scripts/test_audit_phdat_compatibility_readiness.py

      - name: Confirm human-review path stays honest
        shell: bash
        run: |
          set -euo pipefail
          report="$(mktemp)"
          set +e
          python evidence_vault/scripts/validate_pusic_2006_r460.py evidence_vault/datasets/pusic_2006_tables_5_8_r460.csv > "$report"
          status=$?
          set -e
          cat "$report"
          if [ "$status" -eq 0 ]; then
            echo "ERROR: unreviewed extraction unexpectedly passed the independent-review gate"
            exit 1
          fi
          python - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["row_count"] == 144, report
          assert report["validation"] == "FAIL", report
          assert report["scientific_status"] == "SOURCE_EXTRACTED_PENDING_SECOND_REVIEW", report
          assert report["lab_validated"] is False, report
          assert report["phase4b"] == "OPEN" and report["phase5"] == "LOCKED", report
          assert any("second review gate not met" in error for error in report["errors"]), report
          print("PASS: human-review path remains blocked unless a real human review is supplied; the AI route is checked separately.")
          PY
      - name: Verify owner-authorized AI-only Pušić transcription
        run: >-
          python evidence_vault/scripts/validate_pusic_ai_evidence.py
          evidence_vault/datasets/pusic_2006_tables_5_8_r460.csv
          evidence_vault/review_workbooks/pusic_2006_ai_visual_comparison_144.csv

      - name: Test AI-only source review guardrails
        run: python evidence_vault/scripts/test_validate_pusic_ai_evidence.py
      # Figshare shampoo dataset gate intentionally excluded: this is a laundry formulation app.
